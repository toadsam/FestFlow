spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/festival_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

server.port=${PORT:8080}
server.error.include-message=always
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.storage.type=${APP_STORAGE_TYPE:local}
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.endpoint=${AWS_S3_ENDPOINT:}
app.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
app.s3.path-style-access=${AWS_S3_PATH_STYLE_ACCESS:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
app.ops.master-key=${APP_OPS_MASTER_KEY:0000}
app.ops.booth-keys=${APP_OPS_BOOTH_KEYS:1:1111,2:1111,3:1111,4:1111,5:1111,6:1111,7:1111,8:1111,9:1111,10:1111,11:1111,12:1111,13:1111,14:1111,15:1111,16:1111}
app.ops.shared-booth-key=${APP_OPS_SHARED_BOOTH_KEY:1111}
app.sms.provider=${APP_SMS_PROVIDER:none}
app.sms.max-verify-attempts=${APP_SMS_MAX_VERIFY_ATTEMPTS:5}
app.sms.twilio.account-sid=${APP_SMS_TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${APP_SMS_TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${APP_SMS_TWILIO_FROM_NUMBER:}
app.sms.aligo.api-key=${APP_SMS_ALIGO_API_KEY:}
app.sms.aligo.user-id=${APP_SMS_ALIGO_USER_ID:}
app.sms.aligo.sender=${APP_SMS_ALIGO_SENDER:}
app.sms.aligo.test-mode=${APP_SMS_ALIGO_TEST_MODE:false}
app.sms.solapi.api-key=${APP_SOLAPI_API_KEY:}
app.sms.solapi.api-secret=${APP_SOLAPI_API_SECRET:}
app.sms.solapi.api-base-url=${APP_SOLAPI_API_BASE_URL:https://api.solapi.com}
app.sms.solapi.from=${APP_SOLAPI_FROM:}
app.ai-match.sms.enabled=${APP_AI_MATCH_SMS_ENABLED:true}
app.init.admin.username=${APP_INIT_ADMIN_USERNAME:admin}
app.init.admin.password=${APP_INIT_ADMIN_PASSWORD:1234}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-5-mini}
app.openai.image-model=${OPENAI_IMAGE_MODEL:gpt-image-1.5}
app.ai-match.photo-validation.enabled=${APP_AI_MATCH_PHOTO_VALIDATION_ENABLED:true}

