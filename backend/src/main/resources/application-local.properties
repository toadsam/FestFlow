spring.config.import=optional:file:./application-secrets.properties
spring.datasource.url=${SPRING_DATASOURCE_URL_LOCAL:jdbc:mysql://localhost:3306/festival_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME_LOCAL:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD_LOCAL:6247}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO_LOCAL:update}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL_LOCAL:true}
app.jwt.secret=${APP_JWT_SECRET_LOCAL:festflow-local-development-jwt-secret-32bytes}
app.ops.master-key=${APP_OPS_MASTER_KEY_LOCAL:0000}
app.ops.booth-keys=${APP_OPS_BOOTH_KEYS_LOCAL:1:1111,2:1111,3:1111,4:1111,5:1111,6:1111,7:1111,8:1111,9:1111,10:1111,11:1111,12:1111,13:1111,14:1111,15:1111,16:1111}
app.ops.shared-booth-key=${APP_OPS_SHARED_BOOTH_KEY_LOCAL:1111}
app.simulation.enabled=${APP_SIMULATION_ENABLED_LOCAL:true}
app.init.simple-demo-credentials=${APP_INIT_SIMPLE_DEMO_CREDENTIALS_LOCAL:true}
app.staff.demo-login.enabled=${APP_STAFF_DEMO_LOGIN_ENABLED_LOCAL:true}
app.init.admin.username=${APP_INIT_ADMIN_USERNAME_LOCAL:0000}
app.init.admin.password=${APP_INIT_ADMIN_PASSWORD_LOCAL:0000}
app.openai.model=${OPENAI_MODEL:gpt-5-mini}
app.openai.image-model=${OPENAI_IMAGE_MODEL:gpt-image-1.5}
app.ai-match.photo-validation.enabled=${APP_AI_MATCH_PHOTO_VALIDATION_ENABLED:true}
app.sms.provider=${APP_SMS_PROVIDER_LOCAL:none}
app.sms.solapi.api-key=${APP_SOLAPI_API_KEY_LOCAL:${APP_SOLAPI_API_KEY:}}
app.sms.solapi.api-secret=${APP_SOLAPI_API_SECRET_LOCAL:${APP_SOLAPI_API_SECRET:}}
app.sms.solapi.api-base-url=${APP_SOLAPI_API_BASE_URL_LOCAL:https://api.solapi.com}
app.sms.solapi.from=${APP_SOLAPI_FROM_LOCAL:}
app.ai-match.sms.enabled=${APP_AI_MATCH_SMS_ENABLED_LOCAL:true}
app.storage.type=${APP_STORAGE_TYPE:local}
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.endpoint=${AWS_S3_ENDPOINT:}
app.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
app.s3.path-style-access=${AWS_S3_PATH_STYLE_ACCESS:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS_LOCAL:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
